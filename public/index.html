
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoinIntel Analyzer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <img src="logo.png" alt="CoinIntel Analyzer Logo" style="width:80px;margin:10px auto;display:block;">
    <h1 style="text-align:center;color:#00ff9f;">CoinIntel Analyzer</h1>
    <div style="text-align:center;color:#ccc;">Smarter Signals. Sharper Trades.</div>
  </header>
  <main style="padding:20px;">
    <h2 style="text-align:center;color:#00ff9f;">📈 ROI Chart</h2>
    <canvas id="backtestChart" style="max-width:600px;margin:auto;display:block;"></canvas>
  </main>
  <script>
    async function fetchLiveROIData() {
      const response = await fetch('/api/roi');
      const data = await response.json();
      return data.roiData;
    }

    const ctx = document.getElementById('backtestChart').getContext('2d');
    const backtestChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'],
        datasets: [{
          label: 'Simulated ROI (%)',
          data: [0, 0, 0, 0, 0, 0, 0],
          borderColor: '#00ff9f',
          backgroundColor: 'rgba(0,255,159,0.2)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#fff' }, grid: { color: '#333' } },
          y: { ticks: { color: '#fff' }, grid: { color: '#333' } }
        }
      }
    });

    async function updateChartData() {
      try {
        const newData = await fetchLiveROIData();
        backtestChart.data.datasets[0].data = newData;
        backtestChart.update();
      } catch (e) {
        console.error('Failed to fetch live ROI data:', e);
      }
    }

    updateChartData();
    setInterval(updateChartData, 15000);
  </script>
</body>
</html>
